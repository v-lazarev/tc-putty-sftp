name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build release package
        shell: pwsh
        run: ./bin/release.ps1 -Configuration Release -Version 0.0.0-ci

      - name: Build native tests
        shell: pwsh
        run: ./bin/build-tests.ps1

      - name: Run offline tests
        shell: pwsh
        run: ./bin/test.ps1

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: sftpplug-ci-${{ github.sha }}
          path: |
            dist/sftpplug-0.0.0-ci.zip
            dist/sftpplug-0.0.0-ci.zip.sha256
          if-no-files-found: error
          retention-days: 14
