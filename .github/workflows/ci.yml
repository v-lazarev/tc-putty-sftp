name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Build release package
        shell: pwsh
        run: ./bin/release.ps1 -Configuration Release -Version 0.0.0-ci

      - name: Build native tests
        shell: pwsh
        run: ./bin/build-tests.ps1

      - name: Run offline tests
        shell: pwsh
        run: ./bin/test.ps1

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sftpplug-ci-${{ github.sha }}
          path: |
            dist/sftpplug-0.0.0-ci.zip
            dist/sftpplug-0.0.0-ci.zip.sha256
          if-no-files-found: error
          retention-days: 14
